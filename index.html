<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>neal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #moves {
      position: fixed; top: 50%; right: 16px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px;
      max-height: calc(100% - 32px); overflow-y: auto;
    }
    #moves button {
      font: 600 14px system-ui, sans-serif; color: #222;
      background: #fff; border: 1.5px solid #ddd; border-radius: 999px;
      padding: 9px 18px; cursor: pointer; min-width: 120px;
      transition: transform 0.08s, border-color 0.15s, background 0.15s;
    }
    #moves button:hover { border-color: #222; }
    #moves button:active { transform: scale(0.95); }
    #moves button.active { background: #222; border-color: #222; color: #fff; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 14px system-ui, sans-serif; color: #999; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">loading neal…</div>
  <div id="moves"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
